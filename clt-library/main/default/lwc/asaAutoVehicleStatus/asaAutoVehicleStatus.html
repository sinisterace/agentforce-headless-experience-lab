<template>
    <div class="asa-card">

        <h3 class="selector-title">{title}</h3>

        <div class="asa-vs-head">
            <span class="asa-vs-veh">
                <span class="asa-vs-avatar">
                    <template if:true={hasImage}>
                        <img src={imageUrl} alt={vehicleName} onerror={handleImageError} />
                    </template>
                    <template if:false={hasImage}>
                        <span class="asa-vs-avatar-fallback" aria-hidden="true">{initials}</span>
                    </template>
                </span>
                <span class="asa-vs-veh-text">
                    <span class="asa-vs-veh-name">{vehicleName}</span>
                    <template if:true={vehicleTrim}>
                        <span class="asa-vs-veh-trim">{vehicleTrim}</span>
                    </template>
                </span>
            </span>
            <template if:true={hasUpdated}>
                <span class="asa-vs-updated"><span class="asa-vs-live-dot" aria-hidden="true"></span>{updatedText}</span>
            </template>
        </div>

        <div class="asa-vs-meter">
            <svg class={gaugeClass} viewBox="0 0 120 120" role="img" aria-label="Vehicle range gauge">
                <circle class="asa-vs-track" cx="60" cy="60" r="52" pathLength="100"
                    stroke-dasharray={trackDash} transform="rotate(135 60 60)"></circle>
                <circle class="asa-vs-value" cx="60" cy="60" r="52" pathLength="100"
                    stroke-dasharray={valueDash} transform="rotate(135 60 60)"></circle>
            </svg>
            <div class="asa-vs-center">
                <span class="asa-vs-main">{centerMain}<span class="asa-vs-unit">{centerUnit}</span></span>
                <template if:true={centerSub}>
                    <span class="asa-vs-sub">{centerSub}</span>
                </template>
            </div>
        </div>
        <template if:true={hasSubline}>
            <p class="asa-vs-subline">{subline}</p>
        </template>

        <template if:true={hasTires}>
            <div class="asa-vs-tires" role="group" aria-label="Tire pressures">
                <template for:each={tires} for:item="t">
                    <span key={t.key} class={t.cellClass}>
                        <span class="asa-vs-tire-pos">{t.label}</span>
                        <span class="asa-vs-tire-psi">{t.psi}<span class="asa-vs-tire-unit">psi</span></span>
                    </span>
                </template>
                <span class="asa-vs-car" aria-hidden="true">
                    <template if:false={carImageError}>
                        <img class="asa-vs-car-img" src="/resource/asaAutoVehicleTopView" alt="" onerror={handleCarImageError} />
                    </template>
                    <template if:true={carImageError}>
                        <svg class="asa-vs-car-fallback" viewBox="0 0 40 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="8" y="4" width="24" height="56" rx="9"></rect>
                            <path d="M13 18h14"></path>
                            <path d="M13 46h14"></path>
                        </svg>
                    </template>
                </span>
            </div>
        </template>

        <template if:true={hasItems}>
            <div class="asa-vs-items">
                <template for:each={items} for:item="m">
                    <div key={m.key} class={m.tileClass}>
                        <span class="asa-vs-item-label"><span class="asa-vs-dot" aria-hidden="true"></span>{m.label}</span>
                        <span class="asa-vs-item-value">{m.value}</span>
                    </div>
                </template>
            </div>
        </template>

        <template if:true={hasAlerts}>
            <ul class="asa-vs-alerts">
                <template for:each={alerts} for:item="a">
                    <li key={a.key} class="asa-vs-alert">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.29 3.86-8.48 14.14A2 2 0 0 0 3.51 21h16.98a2 2 0 0 0 1.7-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
                        <span class="asa-vs-alert-text">{a.text}</span>
                    </li>
                </template>
            </ul>
        </template>

        <template if:true={hasSubmit}>
            <button type="button" class="asa-vs-cta" onclick={handleSubmit}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"></path></svg>
                {submitText}
            </button>
        </template>
    </div>
</template>
