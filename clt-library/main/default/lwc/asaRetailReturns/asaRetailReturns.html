<template>
    <div class="asa-card">
        <template if:true={title}>
            <h3 class="selector-title">{title}</h3>
        </template>
        <template if:true={hasSubLine}>
            <p class="asa-card-sub">{subLine}</p>
        </template>

        <div class="asa-rt-guide" aria-label="Return progress">
            <span class={itemsGuideClass}><i>1</i><b>Items</b></span>
            <span class={reasonGuideClass}><i>2</i><b>Reason</b></span>
            <span class={methodGuideClass}><i>3</i><b>Review</b></span>
        </div>

        <div class="asa-rt-items">
            <template for:each={items} for:item="it">
                <button
                    key={it.id}
                    type="button"
                    class={it.itemClass}
                    data-id={it.id}
                    aria-pressed={it.isSelected}
                    onclick={handleToggleItem}>
                    <span class="asa-rt-thumb" style={it.mediaStyle}>
                        <template if:true={it.hasImage}>
                            <img src={it.imageUrl} alt={it.name} />
                        </template>
                        <template if:false={it.hasImage}>
                            <span class="asa-rt-glyph" aria-hidden="true">
                                <template if:true={it.isApparel}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path></svg></template>
                                <template if:true={it.isShoes}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"></path><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"></path><path d="M16 17h4"></path><path d="M4 13h4"></path></svg></template>
                                <template if:true={it.isElectronics}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg></template>
                                <template if:true={it.isBeauty}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg></template>
                                <template if:true={it.isHome}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></template>
                                <template if:true={it.isGrocery}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 11 4-7"></path><path d="m19 11-4-7"></path><path d="M2 11h20"></path><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"></path><path d="m9 11 1 9"></path><path d="m15 11-1 9"></path></svg></template>
                                <template if:true={it.isAccessories}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"></circle><polyline points="12 10 12 12 13 13"></polyline><path d="m16.13 7.66-.81-4.05a2 2 0 0 0-2-1.61h-2.68a2 2 0 0 0-2 1.61l-.78 4.05"></path><path d="m7.88 16.36.8 4a2 2 0 0 0 2 1.61h2.72a2 2 0 0 0 2-1.61l.81-4.05"></path></svg></template>
                                <template if:true={it.isOutdoors}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"></path></svg></template>
                                <template if:true={it.isToys}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="8" rx="1"></rect><path d="M10 8V5c0-.6-.4-1-1-1H6a1 1 0 0 0-1 1v3"></path><path d="M19 8V5c0-.6-.4-1-1-1h-3a1 1 0 0 0-1 1v3"></path></svg></template>
                                <template if:true={it.isGeneral}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg></template>
                            </span>
                        </template>
                    </span>
                    <span class="asa-rt-item-text">
                        <span class="asa-rt-item-name" title={it.name}>{it.name}</span>
                        <template if:true={it.hasVariant}>
                            <span class="asa-rt-item-variant">{it.variant}</span>
                        </template>
                        <template if:true={it.hasSku}>
                            <span class="asa-rt-item-sku">SKU {it.sku}</span>
                        </template>
                    </span>
                    <template if:true={it.hasPrice}>
                        <span class="asa-rt-item-price">{it.priceText}</span>
                    </template>
                    <span class={it.checkClass} aria-hidden="true">
                        <template if:true={it.isSelected}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </template>
                    </span>
                </button>
            </template>
        </div>

        <template if:true={hasReasons}>
            <div class="asa-rt-block">
                <span class="asa-rt-legend">Reason for return</span>
                <div class="asa-rt-reasons">
                    <template for:each={reasons} for:item="r">
                        <button
                            key={r.id}
                            type="button"
                            class={r.reasonClass}
                            data-id={r.id}
                            aria-pressed={r.isOn}
                            onclick={handleSelectReason}>
                            {r.label}
                        </button>
                    </template>
                </div>
            </div>
        </template>

        <div class={summaryClass} aria-live="polite">
            <span class="asa-rt-summary-count"><b>{selectedCountLabel}</b><small>items selected</small></span>
            <span class="asa-rt-summary-state">{summaryState}</span>
        </div>

        <button
            type="button"
            class="asa-rt-submit"
            disabled={submitDisabled}
            onclick={handleSubmit}>
            <template if:true={done}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </template>
            <span>{submitLabel}</span>
        </button>
    </div>
</template>
