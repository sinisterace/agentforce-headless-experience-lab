<template>
    <div class="asa-card">

        <div class="asa-th-head">
            <h3 class="selector-title">{title}</h3>
            <template if:true={hasHumidity}>
                <span class="asa-th-humidity" title="Indoor humidity">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7S5.5 9.9 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 9.9 12 2.7 12 2.7Z"></path></svg>
                    {humidityLabel}
                </span>
            </template>
        </div>

        <div class="asa-th-meter">
            <svg class={dialClass} viewBox="0 0 120 120" role="img" aria-label="Thermostat dial">
                <circle class="asa-th-track" cx="60" cy="60" r="52" pathLength="100"
                    stroke-dasharray={trackDash} transform="rotate(135 60 60)"></circle>
                <circle class="asa-th-value" cx="60" cy="60" r="52" pathLength="100"
                    stroke-dasharray={valueDash} transform="rotate(135 60 60)"></circle>
            </svg>
            <div class="asa-th-center">
                <span class="asa-th-current">{currentLabel}<span class="asa-th-deg">°{unit}</span></span>
                <span class="asa-th-target">{targetReadout}</span>
            </div>
        </div>

        <template if:true={hasStatus}>
            <p class="asa-th-status">{statusText}</p>
        </template>

        <!-- Mode chips -->
        <div class="asa-th-modes" role="group" aria-label="Mode">
            <template for:each={modeChips} for:item="m">
                <button key={m.key} type="button" class={m._class} data-mode={m.mode} onclick={handleMode}>{m.label}</button>
            </template>
        </div>

        <!-- Target stepper -->
        <div class="asa-th-stepper">
            <button type="button" class="asa-th-step" data-dir="-1" onclick={handleStep} aria-label="Lower target">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <span class="asa-th-step-label">{targetReadout}</span>
            <button type="button" class="asa-th-step" data-dir="1" onclick={handleStep} aria-label="Raise target">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
            </button>
        </div>

        <!-- Quick-set presets -->
        <template if:true={hasPresets}>
            <div class="asa-th-presets">
                <template for:each={presets} for:item="p">
                    <button key={p.id} type="button" class={p._class} data-id={p.id} onclick={handlePreset}>{p.label}</button>
                </template>
            </div>
        </template>

        <template if:true={hasSubmit}>
            <button type="button" class="asa-th-cta" onclick={handleSubmit}>{submitText}</button>
        </template>
    </div>
</template>
