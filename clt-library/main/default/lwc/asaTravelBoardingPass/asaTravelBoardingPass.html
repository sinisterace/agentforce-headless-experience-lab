<template>
    <div class="clt-live-preview travel-boardingpass-container">

        <template if:true={title}>
            <p class="asa-bp-eyebrow">{title}</p>
        </template>

        <div class="asa-bp-card">
            <span class="asa-bp-sheen" aria-hidden="true"></span>

            <div class="asa-bp-top">
                <span class="asa-bp-airline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 4.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
                    {airline}
                </span>
                <template if:true={hasStatus}>
                    <span class="asa-bp-status">{status}</span>
                </template>
            </div>

            <div class="asa-bp-route">
                <div class="asa-bp-end">
                    <span class="asa-bp-code">{fromCode}</span>
                    <template if:true={hasFromCity}>
                        <span class="asa-bp-city">{fromCity}</span>
                    </template>
                </div>
                <span class="asa-bp-planeline" aria-hidden="true">
                    <i></i>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 4.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
                    <i></i>
                </span>
                <div class="asa-bp-end is-to">
                    <span class="asa-bp-code">{toCode}</span>
                    <template if:true={hasToCity}>
                        <span class="asa-bp-city">{toCity}</span>
                    </template>
                </div>
            </div>

            <div class="asa-bp-times">
                <template for:each={times} for:item="f">
                    <div class="asa-bp-field" key={f.label}>
                        <span class="asa-bp-flabel">{f.label}</span>
                        <span class="asa-bp-fval">{f.value}</span>
                    </div>
                </template>
            </div>

            <div class="asa-bp-stub">
                <template for:each={stub} for:item="f">
                    <div class="asa-bp-field" key={f.label}>
                        <span class="asa-bp-flabel">{f.label}</span>
                        <span class="asa-bp-fval is-strong">{f.value}</span>
                    </div>
                </template>
                <span class="asa-bp-barcode" aria-hidden="true"></span>
            </div>
        </div>

        <div class="asa-bp-actions">
            <button type="button" class="asa-bp-submit" onclick={handleSubmit}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v3"></path><path d="M4 5v14a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-3"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4z"></path></svg>
                {submitText}
            </button>
            <template if:true={hasSecondary}>
                <button type="button" class="asa-bp-secondary" onclick={handleSecondary}>{secondaryText}</button>
            </template>
        </div>
    </div>
</template>
