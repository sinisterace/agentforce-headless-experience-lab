<template>
    <div class="asa-card">
        <template if:true={title}>
            <h3 class="asa-card-title">{title}</h3>
        </template>
        <template if:true={hasSubtitle}>
            <p class="asa-sr-sub">{subtitle}</p>
        </template>

        <template if:true={hasLocation}>
            <div class="asa-sr-loc" aria-label="Location">
                <span class="asa-sr-loc-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </span>
                <span class="asa-sr-loc-text">{locationText}</span>
            </div>
        </template>

        <template if:true={hasRequests}>
            <div class="asa-sr-grid">
                <template for:each={requestTypes} for:item="req">
                    <button
                        key={req.key}
                        type="button"
                        class={req.tileClass}
                        data-index={req.index}
                        aria-pressed={req.selected}
                        onclick={handleSelect}>

                        <span class="asa-sr-ico" aria-hidden="true">
                            <template if:true={req.isRoad}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 7 5"></path><path d="M20 19 17 5"></path><path d="M12 6v2"></path><path d="M12 11v2"></path><path d="M12 16v2"></path></svg>
                            </template>
                            <template if:true={req.isLight}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5C17.7 10.2 18 9 18 7.5a6 6 0 0 0-12 0c0 1.5.3 2.7 1.5 4 .8.8 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
                            </template>
                            <template if:true={req.isGraffiti}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="10" height="13" rx="2"></rect><path d="M9 8V5h6v3"></path><path d="M19.5 4h.01"></path><path d="M21 6.5h.01"></path><path d="M19.5 9h.01"></path></svg>
                            </template>
                            <template if:true={req.isTrash}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </template>
                            <template if:true={req.isWater}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg>
                            </template>
                            <template if:true={req.isBuilding}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"></rect><path d="M9 8h.01"></path><path d="M15 8h.01"></path><path d="M9 12h.01"></path><path d="M15 12h.01"></path><path d="M10 21v-4h4v4"></path></svg>
                            </template>
                            <template if:true={req.isTree}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19a4 4 0 0 1-1-7.9A5 5 0 0 1 17 10a3.5 3.5 0 0 1-1 6.9"></path><path d="M12 15v7"></path></svg>
                            </template>
                            <template if:true={req.isSidewalk}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M3 10h18"></path><path d="M3 16h18"></path><path d="M9 4v16"></path><path d="M15 4v16"></path></svg>
                            </template>
                            <template if:true={req.isNoise}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
                            </template>
                            <template if:true={req.isOther}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
                            </template>
                        </span>

                        <span class="asa-sr-text">
                            <span class="asa-sr-label">{req.label}</span>
                            <template if:true={req.hasDescription}>
                                <span class="asa-sr-desc">{req.description}</span>
                            </template>
                        </span>

                        <span class={req.checkClass} aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                        </span>
                    </button>
                </template>
            </div>
        </template>

        <template if:true={showSubmit}>
            <button type="button" class="asa-sr-submit" onclick={handleSubmit}>{submitLabel}</button>
        </template>
    </div>
</template>
