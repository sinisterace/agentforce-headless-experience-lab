<template>
    <div class="asa-card">

        <div class="asa-ss-head">
            <h3 class="selector-title">{title}</h3>
        </div>

        <!-- Dark network-status console (hero) -->
        <div class={heroClass}>
            <span class="asa-ss-hero-glow" aria-hidden="true"></span>
            <div class="asa-ss-hero-top">
                <span class="asa-ss-hero-badge" aria-hidden="true">
                    <span class="asa-ss-hero-ping"></span>
                    <template if:true={isOverallOk}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                    </template>
                    <template if:true={isOverallDegraded}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </template>
                    <template if:true={isOverallOutage}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                    </template>
                    <template if:true={isOverallMaint}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                    </template>
                </span>
                <div class="asa-ss-hero-text">
                    <span class="asa-ss-hero-kicker">Network status</span>
                    <span class="asa-ss-hero-label">{overallLabel}</span>
                </div>
                <template if:true={hasUpdated}>
                    <span class="asa-ss-hero-updated">{updatedText}</span>
                </template>
            </div>

            <template if:true={hasHeadline}>
                <p class="asa-ss-hero-headline">{headline}</p>
            </template>

            <template if:true={hasMeta}>
                <div class="asa-ss-hero-meta">
                    <template if:true={hasArea}>
                        <span class="asa-ss-hero-chip">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            <span class="asa-ss-chip-text">{area}</span>
                        </span>
                    </template>
                    <template if:true={hasEta}>
                        <span class="asa-ss-hero-chip is-eta">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
                            <span class="asa-ss-chip-text">{etaText}</span>
                        </span>
                    </template>
                </div>
            </template>
        </div>

        <!-- Per-service rows -->
        <ul class="asa-ss-list">
            <template for:each={services} for:item="s">
                <li key={s.key} class={s.rowClass}>
                    <span class="asa-ss-rail" aria-hidden="true"></span>
                    <span class="asa-ss-ico" aria-hidden="true">
                        <template if:true={s.isInternet}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                        </template>
                        <template if:true={s.isTv}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"></rect><path d="m17 2-5 5-5-5"></path></svg>
                        </template>
                        <template if:true={s.isMobile}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                        </template>
                        <template if:true={s.isVoice}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        </template>
                        <template if:true={s.isHome}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        </template>
                        <template if:true={s.isGeneric}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><line x1="8" y1="20" x2="16" y2="20"></line><line x1="12" y1="16" x2="12" y2="20"></line></svg>
                        </template>
                    </span>
                    <span class="asa-ss-row-text">
                        <span class="asa-ss-row-name">{s.name}</span>
                        <span class="asa-ss-row-detail">{s.detail}</span>
                    </span>
                    <span class="asa-ss-pill">
                        <span class="asa-ss-pill-dot" aria-hidden="true"></span>
                        {s.statusLabel}
                    </span>
                </li>
            </template>
        </ul>

        <template if:true={hasSubmit}>
            <button type="button" class="asa-ss-cta" onclick={handleSubmit}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
                {submitText}
            </button>
        </template>
    </div>
</template>
