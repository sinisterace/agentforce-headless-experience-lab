<template>
    <div class="asa-card">
        <template if:true={title}>
            <h3 class="asa-card-title">{title}</h3>
        </template>

        <!-- Transfer flow: source node → directional rail → "To" destinations -->
        <template if:true={fromLabel}>
            <div class="asa-mm-node" aria-label="From account">
                <span class="asa-mm-node-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M3 10h18"></path><path d="m12 3 9 7H3l9-7z"></path><path d="M6 10v11M10 10v11M14 10v11M18 10v11"></path></svg>
                </span>
                <span class="asa-mm-node-meta">
                    <span class="asa-mm-node-label">From</span>
                    <span class="asa-mm-node-value">
                        {fromName}<template if:true={fromMask}> <i class="asa-mm-node-mask">{fromMask}</i></template>
                    </span>
                </span>
            </div>
            <span class="asa-mm-rail" aria-hidden="true">
                <span class="asa-mm-rail-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>
                </span>
            </span>
        </template>

        <template if:true={hasRecipients}>
            <p class="asa-mm-to-label">To</p>
            <div class="asa-mm-list">
                <template for:each={recipients} for:item="rcp">
                    <button
                        key={rcp.key}
                        type="button"
                        class={rcp.rowClass}
                        data-key={rcp.key}
                        aria-pressed={rcp.selected}
                        onclick={handleSelectRecipient}>

                        <span class="asa-mm-icon" aria-hidden="true">
                            <template if:true={rcp.isPerson}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </template>
                            <template if:true={rcp.isCard}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"></rect><path d="M1 10h22"></path></svg>
                            </template>
                            <template if:true={rcp.isAccount}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"></rect><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path><path d="M12 12v3"></path></svg>
                            </template>
                            <template if:true={rcp.isBusiness}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"></path></svg>
                            </template>
                            <template if:true={rcp.isExternal}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M3 10h18"></path><path d="m12 3 9 7H3l9-7z"></path><path d="M6 10v11M18 10v11"></path></svg>
                            </template>
                            <template if:true={rcp.isOtherType}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </template>
                        </span>

                        <span class="asa-mm-meta">
                            <span class="asa-mm-name-text">{rcp.name}</span>
                            <template if:true={rcp.hasDetail}>
                                <span class="asa-mm-sub">{rcp.detailLine}</span>
                            </template>
                        </span>

                        <span class={rcp.checkClass} aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                        </span>
                    </button>
                </template>
            </div>
        </template>

        <template if:true={hasAmounts}>
            <p class="asa-mm-amount-label">Amount</p>
            <div class="asa-mm-chips">
                <template for:each={amounts} for:item="amt">
                    <button
                        key={amt.key}
                        type="button"
                        class={amt.chipClass}
                        data-key={amt.key}
                        aria-pressed={amt.selected}
                        onclick={handleSelectAmount}>
                        {amt.label}
                    </button>
                </template>
            </div>
        </template>

        <template if:true={showSubmit}>
            <button type="button" class="asa-mm-submit" onclick={handleSubmit}>{submitText}</button>
        </template>

        <template if:true={errorMessage}>
            <div class="asa-error">{errorMessage}</div>
        </template>
    </div>
</template>
