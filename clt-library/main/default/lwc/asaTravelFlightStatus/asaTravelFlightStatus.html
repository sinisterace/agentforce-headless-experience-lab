<template>
    <div class="clt-live-preview travel-flightstatus-container">

        <div class="asa-fs-head">
            <div class="asa-fs-headtext">
                <h3 class="selector-title">{title}</h3>
                <template if:true={hasAircraft}>
                    <p class="asa-fs-aircraft">{aircraftLine}</p>
                </template>
            </div>
            <span class={statusClass}>
                <span class="asa-fs-dot" aria-hidden="true"></span>{statusLabel}
            </span>
        </div>

        <div class="asa-fs-route">
            <div class="asa-fs-end">
                <span class="asa-fs-code">{originCode}</span>
                <template if:true={hasOriginCity}>
                    <span class="asa-fs-city">{originCity}</span>
                </template>
                <template if:true={hasOriginTime}>
                    <span class="asa-fs-time">{originTime}</span>
                </template>
            </div>
            <div class="asa-fs-track">
                <span class="asa-fs-line" aria-hidden="true"></span>
                <span class="asa-fs-line-fill" style={fillStyle} aria-hidden="true"></span>
                <span class={planeClass} style={planeStyle} aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
                </span>
            </div>
            <div class="asa-fs-end is-dest">
                <span class="asa-fs-code">{destCode}</span>
                <template if:true={hasDestCity}>
                    <span class="asa-fs-city">{destCity}</span>
                </template>
                <template if:true={hasDestTime}>
                    <span class="asa-fs-time">{destTime}</span>
                </template>
            </div>
        </div>

        <template if:true={hasInfo}>
            <div class="asa-fs-info">
                <template if:true={showDeparts}>
                    <div class="asa-fs-info-cell">
                        <span class="asa-fs-info-label">Departs</span>
                        <span class="asa-fs-info-val">{departsVal}</span>
                    </div>
                </template>
                <template if:true={showArrives}>
                    <div class="asa-fs-info-cell">
                        <span class="asa-fs-info-label">Arrives</span>
                        <span class="asa-fs-info-val">{arrivesVal}</span>
                    </div>
                </template>
                <template if:true={showBaggage}>
                    <div class="asa-fs-info-cell">
                        <span class="asa-fs-info-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2"></path><path d="M8 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14"></path><path d="M10 20h4"></path><circle cx="16" cy="20" r="2"></circle><circle cx="8" cy="20" r="2"></circle></svg>
                            Baggage
                        </span>
                        <span class="asa-fs-info-val">{baggageVal}</span>
                    </div>
                </template>
            </div>
        </template>

        <template if:true={hasUpdated}>
            <p class="asa-fs-updated">{updatedText}</p>
        </template>

        <template if:true={hasSubmit}>
            <button type="button" class="asa-fs-cta" onclick={handleSubmit}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
                {submitText}
            </button>
        </template>
    </div>
</template>
