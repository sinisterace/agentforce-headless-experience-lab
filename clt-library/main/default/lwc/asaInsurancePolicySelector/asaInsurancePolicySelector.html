<template>
    <div class="asa-card">
        <template if:true={title}>
            <h3 class="asa-ins-title">{title}</h3>
        </template>

        <template if:true={hasPolicies}>
            <div class="asa-ins-list">
                <template for:each={policies} for:item="pol">
                    <button
                        key={pol.key}
                        type="button"
                        class={pol.cardClass}
                        data-index={pol.index}
                        aria-pressed={pol.selected}
                        onclick={handleSelect}>

                        <span class="asa-ins-top">
                            <span class="asa-ins-glyph" aria-hidden="true">
                                <template if:true={pol.isAuto}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-4l2-5h11l3 5h1a2 2 0 0 1 2 2v2h-2"></path><path d="M7 17h8"></path><circle cx="6.5" cy="17.5" r="1.5"></circle><circle cx="16.5" cy="17.5" r="1.5"></circle></svg>
                                </template>
                                <template if:true={pol.isHome}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"></path><path d="M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path><path d="M9 21v-6h6v6"></path></svg>
                                </template>
                                <template if:true={pol.isRenters}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path><path d="M9 9h.01M9 12h.01M9 15h.01"></path></svg>
                                </template>
                                <template if:true={pol.isLife}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"></path></svg>
                                </template>
                                <template if:true={pol.isHealth}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                                </template>
                                <template if:true={pol.isUmbrella}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v7a2 2 0 0 0 4 0"></path><path d="M2 12a10 10 0 0 1 20 0Z"></path><path d="M12 2v1"></path></svg>
                                </template>
                                <template if:true={pol.isPet}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"></circle><circle cx="18" cy="8" r="2"></circle><circle cx="20" cy="16" r="2"></circle><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"></path></svg>
                                </template>
                                <template if:true={pol.isTravel}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
                                </template>
                            </span>
                            <span class="asa-ins-id">
                                <span class="asa-ins-name">{pol.name}</span>
                                <span class="asa-ins-sub">
                                    <span class="asa-ins-type">{pol.typeLabel}</span>
                                    <template if:true={pol.mask}>
                                        <span class="asa-ins-num">{pol.mask}</span>
                                    </template>
                                </span>
                            </span>
                            <span class={pol.checkClass} aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                            </span>
                        </span>

                        <template if:true={pol.hasCoverage}>
                            <span class="asa-ins-coverage">
                                <span class="asa-ins-cov-eyebrow">Coverage</span>
                                <span class="asa-ins-cov-text">{pol.coverage}</span>
                            </span>
                        </template>

                        <span class="asa-ins-foot">
                            <template if:true={pol.hasPremium}>
                                <span class="asa-ins-premium">
                                    <b>{pol.premiumDisplay}</b><i class="asa-ins-cadence">{pol.cadenceDisplay}</i>
                                </span>
                            </template>
                            <template if:true={pol.hasRenewal}>
                                <span class="asa-ins-renewal">Renews {pol.renewalDisplay}</span>
                            </template>
                            <span class="asa-ins-foot-right">
                                <template if:true={pol.hasStatus}>
                                    <span class={pol.statusClass}>{pol.statusLabel}</span>
                                </template>
                                <template if:true={pol.badge}>
                                    <span class="asa-ins-badge">{pol.badge}</span>
                                </template>
                            </span>
                        </span>
                    </button>
                </template>
            </div>
        </template>

        <template if:true={showSubmit}>
            <button type="button" class="asa-ins-submit" onclick={handleSubmit}>{submitText}</button>
        </template>

        <template if:true={errorMessage}>
            <div class="asa-error">{errorMessage}</div>
        </template>
    </div>
</template>
