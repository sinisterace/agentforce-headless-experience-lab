<template>
    <div class="asa-card">
        <template if:true={title}>
            <h3 class="asa-card-title">{title}</h3>
        </template>

        <template if:true={hasTransactions}>
            <div class="asa-stmt">
                <template if:true={accountLabel}>
                    <div class="asa-stmt-head">
                        <span class="asa-stmt-head-ico" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M8 7h8M8 11h8M8 15h5"></path></svg>
                        </span>
                        <span class="asa-stmt-head-label">{accountLabel}</span>
                    </div>
                </template>

                <div class="asa-stmt-rows">
                    <template for:each={transactions} for:item="txn">
                        <button
                            key={txn.key}
                            type="button"
                            class={txn.rowClass}
                            data-index={txn.index}
                            aria-pressed={txn.selected}
                            disabled={txn.disabled}
                            onclick={handleSelect}>

                            <span class="asa-stmt-ico" aria-hidden="true">
                                <template if:true={txn.isGroceries}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
                                </template>
                                <template if:true={txn.isDining}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h0a2 2 0 0 0 2-2V2"></path><path d="M5 2v20"></path><path d="M17 2v20M17 8c0-3 2-4 2-4s-4 0-4 4a2 2 0 0 0 2 2h2"></path></svg>
                                </template>
                                <template if:true={txn.isTravel}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
                                </template>
                                <template if:true={txn.isShopping}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                                </template>
                                <template if:true={txn.isBills}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M8 7h8M8 11h8M8 15h5"></path></svg>
                                </template>
                                <template if:true={txn.isTransfer}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg>
                                </template>
                                <template if:true={txn.isIncome}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>
                                </template>
                                <template if:true={txn.isOther}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
                                </template>
                            </span>

                            <span class="asa-stmt-meta">
                                <span class="asa-stmt-merchant">
                                    <span class="asa-stmt-merchant-text">{txn.merchant}</span>
                                    <template if:true={txn.isPending}>
                                        <span class="asa-stmt-badge">Pending</span>
                                    </template>
                                </span>
                                <span class="asa-stmt-sub">{txn.dateDisplay} · {txn.categoryLabel}</span>
                            </span>

                            <span class="asa-stmt-right">
                                <span class={txn.amountClass}>{txn.amountDisplay}</span>
                                <template if:true={txn.selectable}>
                                    <span class={txn.checkClass} aria-hidden="true">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                                    </span>
                                </template>
                            </span>
                        </button>
                    </template>
                </div>
            </div>
        </template>

        <template if:true={showSubmit}>
            <button type="button" class="asa-txn-submit" onclick={handleSubmit}>{disputeText}</button>
        </template>

        <template if:true={errorMessage}>
            <div class="asa-error">{errorMessage}</div>
        </template>
    </div>
</template>
