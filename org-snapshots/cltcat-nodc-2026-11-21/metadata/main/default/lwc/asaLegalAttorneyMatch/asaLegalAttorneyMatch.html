<template>
    <div class="clt-live-preview legal-attorney-container">

        <template if:true={title}>
            <h3 class="selector-title">{title}</h3>
        </template>
        <template if:true={hasSubtitle}>
            <p class="asa-card-sub">{subtitle}</p>
        </template>

        <template if:true={hasAttorneys}>
            <div class="asa-lam-list">
                <template for:each={attorneys} for:item="a">
                    <button
                        type="button"
                        key={a.id}
                        class={a.cardClass}
                        aria-pressed={a.selected}
                        data-id={a.id}
                        onclick={handleSelect}>

                        <span class="asa-lam-avatar" aria-hidden="true">
                            <template if:true={a.showImg}>
                                <img src={a.photoSrc} alt={a.name} data-id={a.id} onerror={handleImgError} />
                            </template>
                            <template if:false={a.showImg}>
                                <span class="asa-lam-initials">{a.initials}</span>
                            </template>
                        </span>

                        <span class="asa-lam-body">
                            <span class="asa-lam-name-row">
                                <span class="asa-lam-name">{a.name}</span>
                                <template if:true={a.selected}>
                                    <span class="asa-lam-check" aria-hidden="true">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                                    </span>
                                </template>
                            </span>
                            <template if:true={a.hasFocusLine}>
                                <span class="asa-lam-focus">{a.focusLine}</span>
                            </template>
                            <template if:true={a.hasStats}>
                                <span class="asa-lam-stats">
                                    <template if:true={a.hasRating}>
                                        <span class="asa-lam-stat">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                            {a.ratingText}
                                        </span>
                                    </template>
                                    <template if:true={a.hasYears}>
                                        <span class="asa-lam-stat">{a.yearsText}</span>
                                    </template>
                                    <template if:true={a.hasCases}>
                                        <span class="asa-lam-stat">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="7"></circle><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"></path></svg>
                                            {a.casesWon}
                                        </span>
                                    </template>
                                </span>
                            </template>
                            <template if:true={a.hasBlurb}>
                                <span class="asa-lam-blurb">{a.blurb}</span>
                            </template>
                            <template if:true={a.hasBar}>
                                <span class="asa-lam-bar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>
                                    {a.bar}
                                </span>
                            </template>
                        </span>
                    </button>
                </template>
            </div>
        </template>

        <template if:true={showSubmit}>
            <div class="submit-container">
                <button type="button" class="asa-lam-submit" onclick={handleSubmit}>{submitText}</button>
            </div>
        </template>
    </div>
</template>
