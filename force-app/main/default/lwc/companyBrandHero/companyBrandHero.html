<template>
  <div class="hub" style={rootStyle}>
    <!-- Website-style accent header (logo + name + visit sit ON the colored bar) -->
    <header class="hub-header">
      <div class="hub-header-inner">
        <div class="hub-brand">
          <template lwc:if={hasLogo}>
            <span class="hub-logo-wrap"><img class="hub-logo" src={logoUrl} alt={companyName} /></span>
          </template>
          <span class="hub-name">{companyName}</span>
        </div>
        <template lwc:if={hasWebsite}>
          <a class="hub-visit" href={website} target="_blank" rel="noopener">Visit {websiteLabel}<span class="hub-visit-arrow" aria-hidden="true">↗</span></a>
        </template>
      </div>
    </header>

    <!-- Welcome -->
    <section class="hub-welcome">
      <h1 class="hub-welcome-title">Welcome to <span class="hub-welcome-name">{companyName}</span> Support</h1>
      <div class="hub-welcome-rule" aria-hidden="true"></div>
    </section>

    <div class="hub-body">
      <!-- About -->
      <template lwc:if={hasSummary}>
        <section class="hub-card hub-card-about">
          <span class="hub-kicker hub-about-kicker">About {companyName}</span>
          <p class="hub-summary">{summary}</p>
          <template lwc:if={hasSignals}>
            <span class="hub-signals-label">Highlights</span>
            <ul class="hub-signals">
              <template for:each={signals} for:item="s">
                <li key={s} class="hub-signal">
                  <span class="hub-signal-check" aria-hidden="true"></span>
                  <span class="hub-signal-text">{s}</span>
                </li>
              </template>
            </ul>
          </template>
        </section>
      </template>

      <!-- Popular questions -->
      <template lwc:if={hasFaqs}>
        <section class="hub-faq-section">
          <span class="hub-kicker">FAQ</span>
          <h2 class="hub-h2">Popular questions</h2>
          <div class="hub-faq-search">
            <span class="hub-faq-search-icon" aria-hidden="true"></span>
            <input type="search" placeholder="Search questions..." value={faqQuery} oninput={handleSearch} aria-label="Search questions" />
          </div>
          <p class="hub-faq-count">{faqResultLabel}</p>
          <ul class="hub-faq-list">
            <template for:each={filteredFaqs} for:item="f">
              <li key={f.id} class={f.itemClass}>
                <button class="hub-faq-q" type="button" data-id={f.id} onclick={toggleFaq} aria-expanded={f.open}>
                  <span class="hub-faq-qtext">{f.question}</span>
                  <span class="hub-faq-icon" aria-hidden="true"></span>
                </button>
                <div class="hub-faq-a-wrap">
                  <div class="hub-faq-a">{f.answer}</div>
                </div>
              </li>
            </template>
          </ul>
          <template lwc:if={noResults}>
            <p class="hub-faq-empty">No questions match your search.</p>
          </template>
        </section>
      </template>

      <!-- Still need help -->
      <section class="hub-footer">
        <h2 class="hub-footer-title">Still need help?</h2>
        <p class="hub-footer-sub">Chat with our AI assistant using the button in the corner — it's here anytime.</p>
        <template lwc:if={hasWebsite}>
          <a class="hub-footer-link" href={website} target="_blank" rel="noopener">Visit {websiteLabel}<span aria-hidden="true"> ↗</span></a>
        </template>
      </section>
    </div>
  </div>
</template>
